name: opencode-review (auto PR review, free)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          agent: reviewer
          prompt: |
            Review this pull request like CodeRabbit.
            Follow pr-reviewer-agent/REVIEW_PROMPT.md exactly.

            Checklist:
            - Bugs / correctness, edge cases
            - Security (injection, secrets, unsafe shell/eval, auth)
            - Performance, reliability, error handling, tests
            - Style vs pr-reviewer-agent/AGENTS.md

            Post as PR comment in this exact shape:
            ## Code Review — pr-reviewer-agent
            **Summary:** ...
            **Verdict:** APPROVE / REQUEST CHANGES / COMMENT
            ### Critical Issues (must fix) with file:line + fix code
            ### Warnings (should fix)
            ### Nitpicks (optional)
            ### Positive Notes
            Do NOT push commits. Only comment. Keep under ~600 words.
