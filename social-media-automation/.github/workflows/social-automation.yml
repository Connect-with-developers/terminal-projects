name: Social Media Automation

on:
  schedule:
    # Run 3 times daily: 9 AM, 3 PM, 9 PM UTC
    - cron: '0 9,15,21 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without posting)'
        required: false
        default: 'true'

jobs:
  automate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd social-media-automation
          pip install -r requirements.txt
      
      - name: Run automation
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        run: |
          cd social-media-automation
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "${{ github.event.inputs.dry_run }}" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
      
      - name: Upload carousel artifacts
        uses: actions/upload-artifact@v3
        with:
          name: carousels-${{ github.run_number }}
          path: social-media-automation/output/carousels/
          retention-days: 7
      
      - name: Commit generated content
        run: |
          cd social-media-automation
          git config user.name "Social Media Bot"
          git config user.email "bot@socialmedia.automation"
          git add output/ automation_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add generated content from $(date +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Automation failed! Check the logs."
          # Add notification logic here (Discord, Slack, etc.)
